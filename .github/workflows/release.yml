name: 发布 NuGet 包

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: 验证并发布
    runs-on: windows-latest
    environment: release
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: 校验标签与版本号
        shell: pwsh
        run: |
          $declaredVersion = ([xml](Get-Content -Raw Version.props)).Project.PropertyGroup.FukeVersion
          $expectedTag = "v$declaredVersion"
          if ('${{ github.ref_name }}' -cne $expectedTag) {
              throw "发布标签必须是 $expectedTag，实际为 ${{ github.ref_name }}。"
          }
          "FUKE_VERSION=$declaredVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: 构建、测试并打包
        run: ./build.cmd Test Pack

      - name: 校验发布包
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem output/packages/*.nupkg)
          if ($packages.Count -eq 0) {
              throw '没有生成任何 NuGet 包。'
          }
          foreach ($package in $packages) {
              if ($package.Name -notmatch "\.$([regex]::Escape($env:FUKE_VERSION))\.nupkg$") {
                  throw "包版本与 Version.props 不一致：$($package.Name)"
              }
          }

      - name: 保存构建产物
        uses: actions/upload-artifact@v4
        with:
          name: fuke-${{ env.FUKE_VERSION }}
          path: output/packages/*.nupkg
          if-no-files-found: error

      - name: 获取 NuGet.org 临时凭据
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: 发布到 NuGet.org
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          $packages = @(Get-ChildItem output/packages/*.nupkg)
          foreach ($package in $packages) {
              dotnet nuget push $package.FullName --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json
              if ($LASTEXITCODE -ne 0) {
                  throw "发布失败：$($package.Name)"
              }
          }

      - name: 创建 GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create '${{ github.ref_name }}' output/packages/*.nupkg --title "Fuke $env:FUKE_VERSION" --notes-file CHANGELOG.md
